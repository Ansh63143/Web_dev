<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    
        .traffic-light {
            width: 100px;
            height: 280px;
            background-color: #222;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        .light {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            opacity: 0.2;
    
            transition: opacity 0.3s ease;
        
        }
        .red {
            background-color: #ff3b30;
        }

        .yellow {
            background-color: #ffcc00;
        }

        .green {
            background-color: #4cd964;
        }

        .red {
            animation: redLight 12s infinite;
        }

        .yellow {
            animation: yellowLight 12s infinite
        }

        .green {
            animation: greenLight 12s infinite;
        }
        @keyframes redLight {

            0%,
            42% {
                opacity: 1;
                filter: drop-shadow(0 0 12px #ff3b30);
            }

            45%,
            100% {
                opacity: 0.2;
                filter: none;
            }
        }
        @keyframes greenLight {

            0%,
            42% {
                opacity: 0.2;
                filter: none;
            }

            45%,
            87% {
                opacity: 1;
                filter: drop-shadow(0 0 12px #4cd964);
            }

            90%,
            100% {
                opacity: 0.2;
                filter: none;
            }
        }
        @keyframes yellowLight {

            0%,
            87% {
                opacity: 0.2;
                filter: none;
            }

            90%,
            97% {
                opacity: 1;
                filter: drop-shadow(0 0 12px #ffcc00);
            }

            100% {
                opacity: 0.2;
                filter: none;
            }
        }
    </style>
</head>

<body>
    <div class="traffic-light">
        <div class="light red"></div>
        <div class="light yellow"></div>
        <div class="light green"></div>
    </div>
</body>

</html>
