<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Profile Card</title>

<style>
/* Global Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #ffffff;
}

/* Purple Background Window Container */
.container {
    width: 420px;
    height: 550px;
    background: #c77dff; /* Solid soft purple background */
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    border-radius: 24px;
}

/* White Card Base */
.card {
    width: 320px;
    background: #fff;
    border-radius: 40px; /* Smooth curved layout borders */
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    position: relative;
    margin-top: 45px; /* Pushes card down to make space for the overlapping image */
}

/* Profile Image Wrapper (Moves entire image + status badge together) */
.profile {
    width: 140px;
    height: 140px;
    margin: 0 auto;
    position: relative;
    top: -85px; /* Pulls image up through the top border */
    margin-bottom: -65px; /* Reclaims the negative layout flow space */
}

.profile-img {
    width: 100%;
    height: 100%;
    border-radius: 35px; /* Clean squircle shape */
    object-fit: cover;
    display: block;
    border: 5px solid #fff; /* White outer frame separating it from the background */
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    
    /* Combines the floating loop and basic state transition cleanly */
    animation: float 4s ease-in-out infinite;
    transition: transform 0.3s ease;
}

/* Hover scales up slightly alongside the baseline floating translation */
.profile:hover .profile-img {
    transform: scale(1.06);
}

/* Online Status Badge (Anchored perfectly inside the .profile container) */
.status {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    position: absolute;
    top: -4px;
    right: -4px;
    border: 4px solid #fff; /* White crisp border ring */
    background: #006400;
    z-index: 2;
    animation: online 1.5s infinite ease-in-out;
}

/* Name & Title Typography */
h2 {
    font-size: 22px;
    font-weight: 700;
    color: #111;
    margin-bottom: 6px;
}

p {
    color: #777;
    font-size: 14px;
    margin-bottom: 30px;
}

/* Stats Layout Subgrid */
.stats {
    display: flex;
    justify-content: space-around;
    margin-bottom: 30px;
}

.stats h3 {
    font-size: 18px;
    color: #111;
    font-weight: 700;
}

.stats span {
    color: #888;
    font-size: 13px;
    display: block;
    margin-top: 4px;
}

/* Button Elements styling */
.buttons {
    display: flex;
    justify-content: space-between;
    gap: 12px;
}

button {
    flex: 1; /* Automatically balances explicit equal width layout splitting */
    height: 42px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: background 0.2s ease, transform 0.2s ease;
}

.follow {
    background: #7b2cbf;
    color: white;
}

.follow:hover {
    background: #5a189a;
    transform: translateY(-1px);
}

.message {
    background: #f2f2f2;
    color: #333;
}

.message:hover {
    background: #e5e5e5;
    transform: translateY(-1px);
}

/* Keyframes: Floating Animation Loop */
@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

/* Keyframes: Glowing Online Status Tracker */
@keyframes online {
    0%, 100% {
        background: #0ea51d;
        box-shadow: 0 0 0 0px rgba(14, 165, 29, 0.6);
    }
    50% {
        background: #1bf030;
        box-shadow: 0 0 0 8px rgba(27, 240, 48, 0);
    }
}
</style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="profile">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300" class="profile-img" alt="Profile Picture">
            <span class="status"></span>
        </div>

        <h2>Sophia Carter</h2>
        <p>Full Stack Developer</p>

        <div class="stats">
            <div>
                <h3>100</h3>
                <span>Posts</span>
            </div>
            <div>
                <h3>940K</h3>
                <span>Followers</span>
            </div>
            <div>
                <h3>185</h3>
                <span>Following</span>
            </div>
        </div>

        <div class="buttons">
            <button class="follow">Follow</button>
            <button class="message">Message</button>
        </div>
    </div>
</div>

</body>
</html>
